<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>歡迎・每日目標（暗色）</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8A5F0E}a:hover{color:#6B4A0B}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.text}}; font-family: 'PingFang TC', 'Noto Sans TC', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden"><div style="padding: 120px 28px 0; display: flex; flex-direction: column; gap: 14px"><span style="font-family: 'Klee One', serif; font-size: 120px; line-height: 1">あ</span><span style="font-size: 28px; font-weight: 700">從零開始學五十音</span><span style="font-size: 15px; line-height: 1.6; color: {{t.muted}}">每天幾分鐘，一次只學幾個字。先學平假名，再學片假名。</span></div><div style="padding: 32px 28px 0; display: flex; flex-direction: column; gap: 10px"><span style="font-size: 15px; font-weight: 700">每天想練多久？</span><div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px"><sc-for list="{{goals}}" as="g" hint-placeholder-count="3"><button onClick="{{g.pick}}" aria-pressed="{{g.on}}" style="min-height: 76px; border-radius: 18px; border: 2px solid {{g.border}}; background: {{g.bg}}; color: {{t.text}}; font-family: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px"><span style="font-size: 17px; font-weight: 700">{{g.label}}</span><span style="font-size: 12px; color: {{t.muted}}">{{g.sub}}</span></button></sc-for></div></div><div style="flex: 1"></div><div style="padding: 0 24px 12px"><a href="C2-02-Home.dc.html" style="min-height: 58px; border-radius: 18px; background: {{accent}}; color: {{onAccent}}; font-size: 16px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center">開始學習</a></div><div style="padding: 0 24px 28px"><a href="C2-12-Settings.dc.html" style="min-height: 44px; display: flex; align-items: center; justify-content: center; color: {{t.muted}}; font-size: 14px; text-decoration: none">之後可以在設定裡更改</a></div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"accent":{"editor":"color","default":"#F2B54A","options":["#F2B54A","#7FC8A9","#8FB3FF","#F28C7A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = {"goal": 1}; }
  renderVals() {
    const dark = (this.props.theme ?? 'dark') === 'dark';
    const t = dark ? { bg: '#15171B', surface: '#1F2228', line: '#2C3038', text: '#F1EFEA', muted: '#A9A59D', track: '#2C3038', chip: '#262A31', next: '#6B6760', faint: '#2A2E35', guide: '#2C3038', accentText: '#F2B54A', accentSoft: '#3A3020' } : { bg: '#F7F5F1', surface: '#FFFFFF', line: '#E7E3DC', text: '#1C1E22', muted: '#5F5B54', track: '#E5E1DA', chip: '#F0EDE7', next: '#A7A198', faint: '#ECE8E1', guide: '#E2DDD5', accentText: '#8A5F0E', accentSoft: '#FBEFD6' };
    const accent = this.props.accent ?? '#F2B54A';
    const onAccent = '#15171B';
    const sel = this.state.goal; const subs = ['輕鬆','推薦','認真']; const R = { goals: ['3 分鐘','5 分鐘','10 分鐘'].map((label, i) => ({ label, sub: subs[i], on: i === sel ? 'true' : 'false', border: i === sel ? accent : t.line, bg: i === sel ? t.accentSoft : t.surface, pick: () => this.setState({ goal: i }) })) };
    return Object.assign({ t, accent, onAccent }, R);
  }
}
</script>
</body>
</html>
