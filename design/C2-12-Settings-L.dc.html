<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>設定（含主題切換）（亮色）</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8A5F0E}a:hover{color:#6B4A0B}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.text}}; font-family: 'PingFang TC', 'Noto Sans TC', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden"><div style="padding: 52px 16px 0; display: flex; align-items: center; gap: 4px"><a href="C2-02-Home-L.dc.html" aria-label="返回" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: {{t.text}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a><span style="font-size: 17px; font-weight: 700">設定</span></div><div style="flex: 1; padding: 8px 24px 0; display: flex; flex-direction: column; gap: 18px"><div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 13px; color: {{t.muted}}; padding-left: 4px">外觀</span><div style="background: {{t.surface}}; border: 1px solid {{t.line}}; border-radius: 20px; padding: 16px 18px; "><div style="display: flex; flex-direction: column; gap: 10px"><span style="font-size: 15px">主題</span><div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; background: {{t.chip}}; border-radius: 12px; padding: 4px"><sc-for list="{{themes}}" as="m" hint-placeholder-count="3"><button onClick="{{m.pick}}" aria-pressed="{{m.on}}" style="min-height: 38px; border-radius: 9px; border: none; background: {{m.bg}}; color: {{m.color}}; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">{{m.label}}</button></sc-for></div></div></div></div><div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 13px; color: {{t.muted}}; padding-left: 4px">學習</span><div style="background: {{t.surface}}; border: 1px solid {{t.line}}; border-radius: 20px; overflow: hidden"><sc-for list="{{rows}}" as="r" hint-placeholder-count="3"><div style="min-height: 56px; padding: 0 18px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid {{t.line}}"><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px">{{r.label}}</span><span style="font-size: 12px; color: {{t.muted}}">{{r.sub}}</span></span><sc-if value="{{r.isToggle}}" hint-placeholder-val="{{ false }}"><button onClick="{{r.toggle}}" aria-label="{{r.label}}" aria-pressed="{{r.on}}" style="width: 52px; height: 32px; border-radius: 999px; border: none; background: {{r.trackBg}}; padding: 3px; display: flex; justify-content: {{r.justify}}; cursor: pointer"><span style="width: 26px; height: 26px; border-radius: 999px; background: #FFFFFF"></span></button></sc-if><sc-if value="{{r.isValue}}" hint-placeholder-val="{{ true }}"><span style="display: flex; align-items: center; gap: 4px; font-size: 14px; color: {{t.muted}}">{{r.value}}<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></span></sc-if></div></sc-for></div></div><div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 13px; color: {{t.muted}}; padding-left: 4px">資料</span><div style="background: {{t.surface}}; border: 1px solid {{t.line}}; border-radius: 20px; padding: 16px 18px; "><span style="font-size: 14px; line-height: 1.6; color: {{t.muted}}">學習紀錄只存在這支手機上，不需要註冊帳號。</span></div></div></div><nav style="border-top: 1px solid {{t.line}}; padding: 8px 8px 28px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px"><a href="C2-02-Home-L.dc.html" style="min-height: 44px; display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; font-size: 11px; color: {{t.muted}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>今天</a><a href="C2-03-Chart-L.dc.html" style="min-height: 44px; display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; font-size: 11px; color: {{t.muted}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>五十音表</a><a href="C2-13-Practice-L.dc.html" style="min-height: 44px; display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; font-size: 11px; color: {{t.muted}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l3 3 8-8"></path><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"></path></svg>練習</a><a href="C2-12-Settings-L.dc.html" style="min-height: 44px; display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; font-size: 11px; color: {{t.accentText}}; font-weight: 700"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"></path></svg>設定</a></nav></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"light"},"accent":{"editor":"color","default":"#F2B54A","options":["#F2B54A","#7FC8A9","#8FB3FF","#F28C7A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = {"mode": 0, "toggles": {"roma": true, "remind": true}}; }
  renderVals() {
    const dark = (this.props.theme ?? 'light') === 'dark';
    const t = dark ? { bg: '#15171B', surface: '#1F2228', line: '#2C3038', text: '#F1EFEA', muted: '#A9A59D', track: '#2C3038', chip: '#262A31', next: '#6B6760', faint: '#2A2E35', guide: '#2C3038', accentText: '#F2B54A', accentSoft: '#3A3020' } : { bg: '#F7F5F1', surface: '#FFFFFF', line: '#E7E3DC', text: '#1C1E22', muted: '#5F5B54', track: '#E5E1DA', chip: '#F0EDE7', next: '#A7A198', faint: '#ECE8E1', guide: '#E2DDD5', accentText: '#8A5F0E', accentSoft: '#FBEFD6' };
    const accent = this.props.accent ?? '#F2B54A';
    const onAccent = '#15171B';
    const mode = this.state.mode; const tg = this.state.toggles; const R = { themes: ['跟隨系統', '亮色', '暗色'].map((label, i) => ({ label, on: i === mode ? 'true' : 'false', bg: i === mode ? t.surface : 'transparent', color: i === mode ? t.text : t.muted, pick: () => this.setState({ mode: i }) })), rows: [{ label: '每日目標', sub: '每天的練習時間', value: '5 分鐘', key: '' }, { label: '顯示羅馬拼音', sub: '熟練後會自動隱藏', key: 'roma' }, { label: '每日提醒', sub: '每天 20:00', key: 'remind' }, { label: '發音速度', sub: '測驗時的播放速度', value: '一般', key: '' }].map(r => { const on = !!tg[r.key]; return { ...r, value: r.value || '', isToggle: !!r.key, isValue: !r.key, on: on ? 'true' : 'false', trackBg: on ? accent : t.track, justify: on ? 'flex-end' : 'flex-start', toggle: () => this.setState({ toggles: { ...tg, [r.key]: !on } }) }; }) };
    return Object.assign({ t, accent, onAccent }, R);
  }
}
</script>
</body>
</html>
