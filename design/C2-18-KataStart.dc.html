<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>片假名開始（暗色）</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8A5F0E}a:hover{color:#6B4A0B}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.text}}; font-family: 'PingFang TC', 'Noto Sans TC', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden"><div style="flex: 1; padding: 0 24px; display: flex; flex-direction: column; justify-content: center; gap: 18px"><span style="font-size: 13px; font-weight: 700; color: {{t.accentText}}; background: {{t.accentSoft}}; padding: 6px 12px; border-radius: 999px; align-self: flex-start">平假名 46 / 46 完成</span><span style="font-size: 28px; font-weight: 700">接下來學片假名</span><span style="font-size: 15px; line-height: 1.6; color: {{t.muted}}">片假名主要用來寫外來語，像是咖啡、電視。讀音跟平假名一樣，只是寫法不同，所以會學得比較快。</span><div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px"><sc-for list="{{map}}" as="m" hint-placeholder-count="3"><div style="background: {{t.surface}}; border: 1px solid {{t.line}}; border-radius: 18px; padding: 14px 8px; display: flex; flex-direction: column; align-items: center; gap: 4px"><span style="display: flex; align-items: center; gap: 8px; font-family: 'Klee One', serif;"><span style="font-size: 22px; color: {{t.muted}}">{{m.h}}</span><span style="font-size: 14px; color: {{t.muted}}">→</span><span style="font-size: 36px">{{m.k}}</span></span><span style="font-size: 12px; color: {{t.muted}}">{{m.r}}</span></div></sc-for></div></div><div style="padding: 0 24px 44px"><a href="C2-19-KataLearn.dc.html" style="min-height: 58px; border-radius: 18px; background: {{accent}}; color: {{onAccent}}; font-size: 16px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center">開始片假名</a></div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"accent":{"editor":"color","default":"#F2B54A","options":["#F2B54A","#7FC8A9","#8FB3FF","#F28C7A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = (this.props.theme ?? 'dark') === 'dark';
    const t = dark ? { bg: '#15171B', surface: '#1F2228', line: '#2C3038', text: '#F1EFEA', muted: '#A9A59D', track: '#2C3038', chip: '#262A31', next: '#6B6760', faint: '#2A2E35', guide: '#2C3038', accentText: '#F2B54A', accentSoft: '#3A3020' } : { bg: '#F7F5F1', surface: '#FFFFFF', line: '#E7E3DC', text: '#1C1E22', muted: '#5F5B54', track: '#E5E1DA', chip: '#F0EDE7', next: '#A7A198', faint: '#ECE8E1', guide: '#E2DDD5', accentText: '#8A5F0E', accentSoft: '#FBEFD6' };
    const accent = this.props.accent ?? '#F2B54A';
    const onAccent = '#15171B';
    const R = { map: [{ h: 'あ', k: 'ア', r: 'a' }, { h: 'か', k: 'カ', r: 'ka' }, { h: 'へ', k: 'ヘ', r: 'he' }] };
    return Object.assign({ t, accent, onAccent }, R);
  }
}
</script>
</body>
</html>
