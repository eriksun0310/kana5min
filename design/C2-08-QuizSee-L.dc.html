<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>測驗・看字選音（亮色）</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8A5F0E}a:hover{color:#6B4A0B}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.text}}; font-family: 'PingFang TC', 'Noto Sans TC', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden"><div style="padding: 52px 16px 0; display: flex; align-items: center; gap: 10px"><a href="C2-02-Home-L.dc.html" aria-label="結束" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: {{t.muted}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a><div style="flex: 1; height: 6px; background: {{t.track}}; border-radius: 3px; overflow: hidden"><div style="width: 55%; height: 100%; background: {{accent}}"></div></div><span style="width: 44px; text-align: center; font-size: 13px; color: {{t.muted}}"></span></div><div style="padding: 34px 24px 0; display: flex; flex-direction: column; align-items: center; gap: 6px"><span style="font-size: 15px; color: {{t.muted}}">這個字怎麼念？</span><span style="font-family: 'Klee One', serif; font-size: 170px; line-height: 1.1">け</span></div><div style="padding: 20px 24px 0; display: flex; flex-direction: column; gap: 10px"><sc-for list="{{opts}}" as="o" hint-placeholder-count="4"><button onClick="{{o.pick}}" style="min-height: 62px; border-radius: 18px; border: 2px solid {{o.border}}; background: {{o.bg}}; color: {{t.text}}; font-family: inherit; font-size: 16px; cursor: pointer; display: flex; align-items: center; gap: 14px; padding: 0 18px"><span style="width: 36px; height: 36px; border-radius: 999px; background: {{t.chip}}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"></path><path d="M16 9a4 4 0 0 1 0 6"></path></svg></span><span style="flex: 1; text-align: left">聲音 {{o.n}}</span><span style="font-size: 14px; color: {{o.tagColor}}">{{o.tag}}</span></button></sc-for></div><div style="flex: 1"></div><div style="padding: 0 24px 44px"><sc-if value="{{waiting}}" hint-placeholder-val="{{ true }}"><button disabled style="width: 100%; min-height: 58px; border-radius: 18px; border: none; background: {{t.track}}; color: {{t.muted}}; font-family: inherit; font-size: 16px; font-weight: 700">點聲音聽聽看，再選一個</button></sc-if><sc-if value="{{done}}" hint-placeholder-val="{{ false }}"><a href="C2-09-QuizHear-L.dc.html" style="min-height: 58px; border-radius: 18px; background: {{accent}}; color: {{onAccent}}; font-size: 16px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center">下一題</a></sc-if></div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"light"},"accent":{"editor":"color","default":"#F2B54A","options":["#F2B54A","#7FC8A9","#8FB3FF","#F28C7A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = {"picked": null}; }
  renderVals() {
    const dark = (this.props.theme ?? 'light') === 'dark';
    const t = dark ? { bg: '#15171B', surface: '#1F2228', line: '#2C3038', text: '#F1EFEA', muted: '#A9A59D', track: '#2C3038', chip: '#262A31', next: '#6B6760', faint: '#2A2E35', guide: '#2C3038', accentText: '#F2B54A', accentSoft: '#3A3020' } : { bg: '#F7F5F1', surface: '#FFFFFF', line: '#E7E3DC', text: '#1C1E22', muted: '#5F5B54', track: '#E5E1DA', chip: '#F0EDE7', next: '#A7A198', faint: '#ECE8E1', guide: '#E2DDD5', accentText: '#8A5F0E', accentSoft: '#FBEFD6' };
    const accent = this.props.accent ?? '#F2B54A';
    const onAccent = '#15171B';
    const okB = dark ? '#7FC8A9' : '#2F8A63', okBg = dark ? '#1D2E28' : '#E5F3EC', okT = dark ? '#9FDCC2' : '#1F6B49', noB = dark ? '#F28C7A' : '#D9644F', noBg = dark ? '#33221F' : '#FBE9E5', noT = dark ? '#F7B0A4' : '#A23A28'; const picked = this.state.picked; const roma = ['', 'ka', 'ki', 'ke', 'ko']; const R = { waiting: picked === null, done: picked !== null, opts: [1, 2, 3, 4].map(n => { let border = t.line, bg = t.surface, tag = '', tagColor = t.muted; if (picked !== null) { if (n === 3) { border = okB; bg = okBg; tag = 'ke・正確'; tagColor = okT; } else if (n === picked) { border = noB; bg = noBg; tag = roma[n]; tagColor = noT; } else { tag = roma[n]; } } return { n, border, bg, tag, tagColor, pick: () => this.setState({ picked: n }) }; }) };
    return Object.assign({ t, accent, onAccent }, R);
  }
}
</script>
</body>
</html>
