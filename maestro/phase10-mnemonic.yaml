# 對比頁「你可以這樣記」：每個字顯示差異提示；諧音句沿用記憶包（沒解鎖顯示鎖頭，點下去關面板開解鎖面板）；ソ 顯示昭和寫法的 そ。
appId: com.ptalk.kana5min
---
- runFlow:
    file: common/onboard.yaml
    env:
      GOAL: '5'
- runFlow:
    file: common/preset.yaml
    env:
      PRESET: katakana-started
- extendedWaitUntil:
    visible:
      id: tab-practice
    timeout: 10000
- tapOn:
    id: tab-practice
- tapOn:
    id: group-ruro
- assertVisible:
    id: open-mnemonic
- tapOn:
    id: open-mnemonic
- extendedWaitUntil:
    visible:
      id: mnemonic-h-ru
    timeout: 5000
- assertVisible:
    id: mnemonic-h-ro
- assertVisible:
    id: mnemonic-how
- assertVisible: ".*底部有圈.*"
- assertVisible:
    id: mnemonic-pun-locked-h-ru
# 點未解鎖的諧音：面板關掉，開解鎖面板
- tapOn:
    id: mnemonic-pun-locked-h-ru
- extendedWaitUntil:
    notVisible:
      id: mnemonic-sheet
    timeout: 5000
- assertVisible: ".*解鎖.*"
# 重開 App 再測 ソ・ン（同一次啟動內第二次開彈出層，Maestro 讀不到內容）
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible:
      id: tab-practice
    timeout: 15000
- tapOn:
    id: tab-practice
- tapOn:
    id: see-all-groups
- tapOn:
    id: catalog-tab-katakana
- tapOn:
    id: group-son
- tapOn:
    id: open-mnemonic
- extendedWaitUntil:
    visible:
      id: mnemonic-k-so
    timeout: 5000
- assertVisible: ".*昭和寫法的 そ.*"
- assertVisible:
    id: mnemonic-how
