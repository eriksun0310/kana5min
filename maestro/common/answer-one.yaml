# 答一題（選正確答案）並前進到下一題；__DEV__ 版本正確選項 testID 為 opt-correct。
appId: com.ptalk.kana5min
---
- runFlow:
    when:
      visible:
        id: quiz-kana
    commands:
      - tapOn:
          id: opt-correct
      - tapOn:
          id: quiz-confirm
- runFlow:
    when:
      visible:
        id: replay-audio
    commands:
      - tapOn:
          id: opt-correct
- runFlow:
    when:
      visible:
        id: wordread-text
    commands:
      - tapOn:
          id: opt-correct
- runFlow:
    when:
      visible:
        id: quiz-maskhalf
    commands:
      - tapOn:
          id: opt-correct
- runFlow:
    when:
      visible:
        id: quiz-recall
    commands:
      - tapOn:
          id: recall-flip
      - tapOn:
          id: recall-yes
- runFlow:
    when:
      visible:
        id: quiz-spoterr
    commands:
      - tapOn:
          id: spot-target
      - tapOn:
          id: quiz-confirm
- runFlow:
    when:
      visible:
        id: quiz-readseq
    commands:
      - tapOn:
          id: dev-solve
      - tapOn:
          id: quiz-confirm
- runFlow:
    when:
      visible:
        id: quiz-wordread
    commands:
      - tapOn:
          id: opt-correct
- runFlow:
    when:
      visible:
        id: quiz-all
    commands:
      - tapOn:
          id: dev-solve
      - tapOn:
          id: quiz-confirm
- runFlow:
    when:
      visible:
        id: quiz-seq
    commands:
      - tapOn:
          id: opt-correct
      - tapOn:
          id: quiz-confirm
- runFlow:
    when:
      visible:
        id: quiz-next
    commands:
      - tapOn:
          id: quiz-next
