# 以開發用深連結套用進度預設（只在 __DEV__ 版本有效，見 docs/architecture.md 第 10 節）。
# 用法：runFlow: { file: common/preset.yaml, env: { PRESET: hiragana-done } }
# PRESET = hiragana-almost | hiragana-done | katakana-started | all-done | reset
# hiragana-done 套用後首頁會推出 C2-18（kata-start）；其他預設回到首頁。
# 模擬器開 custom scheme 時可能跳出「要在「Kana 5min」中打開嗎？」系統確認框，出現就點「打開」。
appId: com.ptalk.kana5min
---
- openLink: kana5min://debug?preset=${PRESET}
- runFlow:
    when:
      visible: "(打開|Open)"
    commands:
      - tapOn: "(打開|Open)"
# 回到首頁（有「練習」分頁標籤）；hiragana-done 會先跳出 C2-18，沒有分頁列，所以也接受「開始片假名」。
- extendedWaitUntil:
    visible: "(練習|開始片假名)"
    timeout: 15000
- waitForAnimationToEnd
